<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d2240"/>
      <stop offset="60%" stop-color="#1a4a8a"/>
      <stop offset="100%" stop-color="#2d7dd2"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2535"/>
      <stop offset="100%" stop-color="#0d151f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f5a623" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f5a623" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mountain1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f2035"/>
    </linearGradient>
    <linearGradient id="mountain2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15304f"/>
      <stop offset="100%" stop-color="#0a1a2e"/>
    </linearGradient>
  </defs>
  <!-- sky -->
  <rect width="1200" height="900" fill="url(#sky)"/>
  <!-- sun/moon glow -->
  <ellipse cx="600" cy="340" rx="420" ry="260" fill="url(#glow)"/>
  <!-- stars -->
  <g fill="#fff" opacity="0.7">
    <circle cx="80" cy="60" r="1.5"/><circle cx="180" cy="30" r="1"/><circle cx="320" cy="80" r="1.5"/>
    <circle cx="480" cy="45" r="1"/><circle cx="620" cy="25" r="2"/><circle cx="750" cy="70" r="1.5"/>
    <circle cx="900" cy="40" r="1"/><circle cx="1050" cy="65" r="1.5"/><circle cx="1150" cy="30" r="1"/>
    <circle cx="140" cy="130" r="1"/><circle cx="280" cy="155" r="1.5"/><circle cx="440" cy="120" r="1"/>
    <circle cx="560" cy="150" r="2"/><circle cx="700" cy="130" r="1"/><circle cx="860" cy="145" r="1.5"/>
    <circle cx="1000" cy="120" r="1"/><circle cx="1100" cy="140" r="1"/>
  </g>
  <!-- moon -->
  <circle cx="900" cy="130" r="45" fill="#fffde7" opacity="0.9"/>
  <circle cx="925" cy="115" r="38" fill="#1a4a8a" opacity="0.9"/>
  <!-- mountain back -->
  <polygon points="0,560 220,280 440,560" fill="url(#mountain1)" opacity="0.8"/>
  <polygon points="300,560 580,220 860,560" fill="url(#mountain2)" opacity="0.9"/>
  <polygon points="600,560 900,300 1200,560" fill="url(#mountain1)" opacity="0.8"/>
  <polygon points="900,560 1100,350 1200,440 1200,560" fill="url(#mountain2)" opacity="0.7"/>
  <!-- mountain snow caps -->
  <polygon points="220,280 200,310 240,310" fill="#e8f0fb" opacity="0.9"/>
  <polygon points="580,220 555,265 605,265" fill="#e8f0fb" opacity="0.95"/>
  <polygon points="900,300 875,345 925,345" fill="#e8f0fb" opacity="0.9"/>
  <!-- road ground -->
  <rect x="0" y="680" width="1200" height="220" fill="url(#road)"/>
  <!-- road surface -->
  <rect x="460" y="680" width="280" height="220" fill="#1e2b3a"/>
  <!-- road lines -->
  <rect x="593" y="690" width="14" height="40" fill="#f5c842" rx="3"/>
  <rect x="593" y="750" width="14" height="40" fill="#f5c842" rx="3"/>
  <rect x="593" y="810" width="14" height="40" fill="#f5c842" rx="3"/>
  <rect x="593" y="870" width="14" height="40" fill="#f5c842" rx="3"/>
  <!-- road edge lines -->
  <rect x="468" y="680" width="5" height="220" fill="#f5c842" opacity="0.7"/>
  <rect x="727" y="680" width="5" height="220" fill="#f5c842" opacity="0.7"/>
  <!-- car body -->
  <g transform="translate(520, 580)">
    <!-- main body -->
    <rect x="20" y="55" width="160" height="55" rx="8" fill="#1f5fd0"/>
    <!-- cabin top -->
    <path d="M55 55 L80 20 L140 20 L165 55 Z" fill="#2d7dd2"/>
    <!-- windows -->
    <rect x="84" y="24" width="48" height="28" rx="4" fill="#c8e6fa" opacity="0.9"/>
    <rect x="136" y="24" width="24" height="28" rx="4" fill="#c8e6fa" opacity="0.7"/>
    <!-- wheels -->
    <circle cx="55" cy="112" r="22" fill="#1a2535"/>
    <circle cx="55" cy="112" r="13" fill="#c8d8ea"/>
    <circle cx="55" cy="112" r="5" fill="#1a2535"/>
    <circle cx="145" cy="112" r="22" fill="#1a2535"/>
    <circle cx="145" cy="112" r="13" fill="#c8d8ea"/>
    <circle cx="145" cy="112" r="5" fill="#1a2535"/>
    <!-- headlight -->
    <rect x="176" y="68" width="16" height="10" rx="3" fill="#fffde7"/>
    <ellipse cx="192" cy="73" rx="10" ry="20" fill="#fffde7" opacity="0.25"/>
    <!-- tail light -->
    <rect x="8" y="70" width="12" height="8" rx="2" fill="#f55e42"/>
  </g>
  <!-- trees left -->
  <g opacity="0.85">
    <rect x="60" y="610" width="12" height="70" fill="#2a3c28"/>
    <ellipse cx="66" cy="590" rx="32" ry="40" fill="#2d6a2d"/>
    <ellipse cx="66" cy="570" rx="22" ry="30" fill="#3a8c3a"/>
    <!-- tree 2 -->
    <rect x="140" y="630" width="10" height="50" fill="#2a3c28"/>
    <ellipse cx="145" cy="615" rx="26" ry="32" fill="#2d6a2d"/>
    <ellipse cx="145" cy="600" rx="18" ry="22" fill="#3a8c3a"/>
    <!-- tree 3 -->
    <rect x="30" y="640" width="8" height="40" fill="#2a3c28"/>
    <ellipse cx="34" cy="628" rx="20" ry="25" fill="#1f5020"/>
  </g>
  <!-- trees right -->
  <g opacity="0.85">
    <rect x="1080" y="615" width="12" height="65" fill="#2a3c28"/>
    <ellipse cx="1086" cy="595" rx="30" ry="38" fill="#2d6a2d"/>
    <ellipse cx="1086" cy="575" rx="20" ry="28" fill="#3a8c3a"/>
    <rect x="1140" y="635" width="10" height="45" fill="#2a3c28"/>
    <ellipse cx="1145" cy="620" rx="24" ry="30" fill="#2d6a2d"/>
    <ellipse cx="1145" cy="606" rx="16" ry="20" fill="#3a8c3a"/>
    <rect x="1020" y="645" width="9" height="35" fill="#2a3c28"/>
    <ellipse cx="1025" cy="633" rx="20" ry="24" fill="#1f5020"/>
  </g>
  <!-- horizontal glow on horizon -->
  <ellipse cx="600" cy="680" rx="800" ry="80" fill="#2d7dd2" opacity="0.3"/>
</svg>